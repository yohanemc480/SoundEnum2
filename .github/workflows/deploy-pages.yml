name: GitHub Pagesへ公開

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    # 手動実行でも公開元をmainに限定する。
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: ソースを取得
        uses: actions/checkout@v6
      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: 依存パッケージをインストール
        run: npm ci
      - name: 公開音声用のPythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-release-audio.txt
      - name: 音声圧縮の依存パッケージをインストール
        run: python -m pip install -r tools/requirements-release-audio.txt
      - name: 圧縮音声をキャッシュ
        uses: actions/cache@v4
        with:
          path: .cache/release-audio
          key: release-audio-${{ runner.os }}-${{ hashFiles('tools/build_release_audio.py', 'tools/requirements-release-audio.txt') }}-${{ hashFiles('resource/*/audio-file-hashes.json') }}
          restore-keys: |
            release-audio-${{ runner.os }}-${{ hashFiles('tools/build_release_audio.py', 'tools/requirements-release-audio.txt') }}-
      - name: 音声圧縮のテスト
        run: python -m unittest discover -s tests -p test_release_audio.py
      - name: テスト
        run: npm test
      - name: 検索データを検証
        run: npm run verify:data
      - name: 型チェックと本番ビルド
        run: npm run build
      - name: GitHub Pagesを準備
        uses: actions/configure-pages@v5
      - name: 公開用ファイルをアップロード
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pagesへ公開
        id: deployment
        uses: actions/deploy-pages@v4
