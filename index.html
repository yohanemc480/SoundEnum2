<!DOCTYPE html>
<html lang="ja" data-startup="loading">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- First-paint styles must be available before module/CSS downloads. -->
  <style>
    html { background: #111617; color-scheme: dark; }
    html[data-startup] body > :not(#startup-status):not(noscript) { visibility: hidden !important; }
    #startup-status { position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; gap: 16px; margin: 0; padding: 24px; background: #111617; color: #e6eeeb; font: 14px/1.5 sans-serif; text-align: center; }
    #startup-status[hidden] { display: none; }
    #startup-status button { padding: 8px 16px; cursor: pointer; }
  </style>
  <title data-i18n="appTitle">Minecraft Sound Browser</title>
  <link rel="icon" href="favicon.ico?v=waveform" sizes="16x16 32x32 48x48 64x64 128x128 256x256">
  <link rel="icon" type="image/png" sizes="256x256" href="favicon.png">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
  <div id="startup-status" role="status" aria-live="polite">
    <p id="startup-message">読み込み中…</p>
    <button id="startup-retry" type="button" hidden>再読み込み</button>
  </div>
  <noscript>このページを使うにはJavaScriptを有効にしてください。<style>#startup-status { display: none; }</style></noscript>
  <header data-layout-style="appHeader">
    <div data-layout-style="appHeaderIdentity">
      <h1 data-layout-style="appBrand" data-i18n-aria-label="appTitle"><span data-layout-style="eyebrow" data-i18n="appEyebrow">MINECRAFT</span><span data-layout-style="brandName" data-i18n="appName">Sound Browser</span></h1>
      <label data-layout-style="versionSelector"><span data-i18n="version"></span><select id="resource-version" disabled></select></label>
    </div>
    <div data-layout-style="appHeaderActions">
      <p data-i18n="appTagline"></p>
      <div data-layout-style="settingsControl">
        <span id="build-commit" data-layout-style="buildCommit" title="__BUILD_COMMIT_SHA__"><span data-i18n="buildCommitLabel">Build:</span> __BUILD_COMMIT_SHORT__</span>
        <button type="button" data-settings-style="settingsButton appSettingsButton" popovertarget="app-settings" data-i18n-aria-label="settings" data-i18n-title="settings">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M10 2h4l.5 3 1.4.8 2.8-1 2 3.4-2.3 2v1.6l2.3 2-2 3.4-2.8-1-1.4.8-.5 3h-4l-.5-3-1.4-.8-2.8 1-2-3.4 2.3-2v-1.6l-2.3-2 2-3.4 2.8 1 1.4-.8Z" transform="translate(0 1)"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
  </header>
  <section id="app-settings" data-settings-style="settingsPopover appSettingsPopover" popover="auto" aria-labelledby="app-settings-title">
    <div data-layout-style="sectionHeading"><h2 id="app-settings-title" data-i18n="settings"></h2><button type="button" data-settings-style="settingsButton closeButton" popovertarget="app-settings" popovertargetaction="hide" data-i18n-aria-label="close"></button></div>
    <button id="clear-local-storage" type="button" data-settings-style="settingsButton" data-i18n="clearLocalStorage"></button>
  </section>
  <main data-layout-style="workspace">
    <section data-layout-style="main" data-i18n-aria-label="soundSelection">
      <section data-layout-style="panel browserPanel">
        <div data-search-style="browserHeader">
          <div data-search-style="browserTabs" role="tablist" data-i18n-aria-label="browserTabs">
            <button type="button" id="search-tab" data-browser-tab role="tab" aria-selected="true" aria-controls="search-panel" data-i18n="searchTitle"></button>
            <button type="button" id="favorites-tab" data-browser-tab role="tab" aria-selected="false" aria-controls="favorites-panel" tabindex="-1" data-i18n="favoritesTitle"></button>
            <button type="button" id="compositions-tab" data-browser-tab role="tab" aria-selected="false" aria-controls="compositions-panel" tabindex="-1" data-i18n="savedCompositionsTitle"></button>
          </div>
        </div>
        <div id="search-panel" role="tabpanel" aria-labelledby="search-tab">
          <form id="search-form-container">
            <fieldset id="search-form" disabled>
              <div data-search-style="searchFilters">
                <div data-search-style="searchTextField"><label for="search-query" data-i18n="soundName"></label><div data-search-style="clearableInput"><input id="search-query" type="search" data-i18n-placeholder="queryPlaceholder"><button id="search-clear-query" type="button" data-search-style="inputClear" data-settings-style="closeButton" data-i18n-aria-label="searchClearQuery"></button></div></div>
                <div data-search-style="searchTextField"><label for="search-base" data-i18n="searchBase"></label><div data-search-style="clearableInput"><input id="search-base" data-i18n-placeholder="searchBasePlaceholder" autocomplete="off"><button id="search-clear-base" type="button" data-search-style="inputClear" data-settings-style="closeButton" data-i18n-aria-label="searchClearBase"></button></div></div>
                <div data-search-style="searchTagsField"><span data-i18n="searchTags"></span><div id="search-tags" data-search-style="searchTags" role="group" data-i18n-aria-label="searchTags"></div></div>
              </div>
              <div data-search-style="searchOptionsRow">
                <label data-search-style="searchOption"><input id="search-exclude-multiple" type="checkbox"><span data-i18n="searchExcludeMultiple"></span></label>
                <button id="search-clear" type="button" data-i18n="searchClear"></button>
              </div>
            </fieldset>
          </form>
          <div id="search-base-preview" data-i18n-aria-label="searchBase" role="region" hidden></div>
          <p id="search-status" role="status"></p>
          <button id="search-retry" type="button" hidden data-i18n="retry"></button>
          <div id="search-list" data-layout-style="searchList"></div>
          <nav id="search-pagination" data-search-style="searchPagination" hidden data-i18n-aria-label="selectPage">
            <button id="search-previous" type="button" data-i18n="previous"></button><span id="search-page"></span><button id="search-next" type="button" data-i18n="next"></button>
          </nav>
        </div>
        <div id="favorites-panel" role="tabpanel" aria-labelledby="favorites-tab" hidden>
          <p id="favorites-status" role="status"></p>
          <div id="favorites-list" data-layout-style="searchList"></div>
        </div>
        <div id="compositions-panel" role="tabpanel" aria-labelledby="compositions-tab" hidden>
          <p id="saved-compositions-status" role="status"></p>
          <div id="saved-compositions-list" data-layout-style="searchList"></div>
        </div>
      </section>
    </section>
    <aside data-layout-style="sub" data-i18n-aria-label="previewAndComposition">
      <section class="preview-panel" data-layout-style="panel">
        <div data-layout-style="sectionHeading" data-playback-style="heading"><h2 data-i18n="preview"></h2><span id="preview-sound-id" aria-live="polite"></span><span data-playback-style="indicator"><span id="preview-loading" role="status" data-i18n-aria-label="loading" hidden></span></span></div>
        <div data-playback-style="transport">
          <button id="preview-toggle" type="button" data-playback-style="button" data-i18n-aria-label="play" data-i18n-title="play" disabled>
            <svg data-playback-style="playIcon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 5v14l11-7z"/></svg>
            <svg data-playback-style="pauseIcon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
          </button>
          <div data-volume-control>
            <button id="preview-volume-toggle" type="button" data-playback-style="button" data-i18n-aria-label="previewVolume" aria-controls="select-master-volume" aria-expanded="false">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 9v6h4l5 4V5L7 9H3zm12-1v8a5 5 0 0 0 0-8zm0-4v2a7 7 0 0 1 0 12v2a9 9 0 0 0 0-16z"/></svg>
            </button>
            <div id="select-master-volume" role="group" data-i18n-aria-label="previewVolume" aria-hidden="true" inert></div>
          </div>
          <div data-playback-style="waveformContainer">
            <canvas id="preview-waveform" aria-hidden="true"></canvas>
            <input id="preview-seek" type="range" min="0" max="0" step="0.01" value="0" data-i18n-aria-label="seek" disabled>
          </div>
          <output id="preview-time">0:00.0 / 0:00.0</output>
        </div>
        <p id="preview-status" role="status"></p>
        <div data-playback-style="command">
          <div data-layout-style="sectionHeading"><h2 data-i18n="command"></h2><div id="playback-settings" data-settings-style="soundSettings" role="group" data-i18n-aria-label="playbackSettings"></div></div>
          <div id="preview-output" aria-live="polite"></div>
        </div>
      </section>
      <section id="composition-panel" data-layout-style="panel compositionPanel" aria-labelledby="composition-title">
        <div data-layout-style="sectionHeading"><div data-layout-style="compositionTitle"><h2 id="composition-title" data-i18n="compositionTitle"></h2><span id="composition-count"></span></div><span data-layout-style="compositionHeadingStatus"><span data-playback-style="indicator"><span id="composition-loading" role="status" data-i18n-aria-label="loading" hidden></span></span></span></div>
        <div data-layout-style="compositionToolbar" data-playback-style="transport">
          <button id="composition-play" type="button" data-playback-style="button" data-i18n-aria-label="compositionPlay" data-i18n-title="compositionPlay" disabled>
            <svg data-playback-style="compositionPlayIcon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 5v14l11-7z"/></svg>
            <svg data-playback-style="stopIcon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6h12v12H6z"/></svg>
          </button>
          <div data-volume-control>
            <button id="composition-volume-toggle" type="button" data-playback-style="button" data-i18n-aria-label="previewVolume" aria-controls="composition-volume" aria-expanded="false">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 9v6h4l5 4V5L7 9H3zm12-1v8a5 5 0 0 0 0-8zm0-4v2a7 7 0 0 1 0 12v2a9 9 0 0 0 0-16z"/></svg>
            </button>
            <div id="composition-volume" role="group" data-i18n-aria-label="previewVolume" aria-hidden="true" inert></div>
          </div>
          <canvas id="composition-waveform" role="img" data-i18n-aria-label="compositionWaveform"></canvas>
          <output id="composition-time">0:00.0 / 0:00.0</output>
        </div>
        <p id="composition-status" role="status"></p>
        <div id="composition-list" data-layout-style="searchList"></div>
        <div data-layout-style="compositionSaveActions"><button id="save-composition" type="button" data-settings-style="settingsButton" data-i18n="savedCompositionSave" disabled></button></div>
        <div data-layout-style="compositionCommand">
          <div data-layout-style="sectionHeading"><h2 data-i18n="command"></h2></div>
          <div id="composition-output" aria-live="polite"></div>
        </div>
      </section>
    </aside>
  </main>
  <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <script src="Scripts/App/Bootstrap.ts" type="module"></script>
</body>
</html>
