<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="appTitle"></title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
  <header class="app-header">
    <div><div class="eyebrow" data-i18n="appEyebrow"></div><h1>SoundEnum<span class="brand-dot">.</span></h1></div>
    <p data-i18n="appTagline"></p>
  </header>
  <main class="workspace">
    <section class="main" data-i18n-aria-label="soundSelection">
      <section class="panel browser-panel">
        <div class="browser-header">
          <div class="browser-tabs" role="tablist" data-i18n-aria-label="browserTabs">
            <button type="button" id="search-tab" data-browser-tab role="tab" aria-selected="true" aria-controls="search-panel" data-i18n="searchTitle"></button>
            <button type="button" id="favorites-tab" data-browser-tab role="tab" aria-selected="false" aria-controls="favorites-panel" tabindex="-1" data-i18n="favoritesTitle"></button>
          </div>
          <label class="version-selector"><span data-i18n="version"></span><select id="resource-version" disabled></select></label>
        </div>
        <div id="search-panel" role="tabpanel" aria-labelledby="search-tab">
          <form id="search-form-container">
            <fieldset id="search-form" disabled>
              <div class="search-filters">
                <label><span data-i18n="soundName"></span><input id="search-query" type="search" data-i18n-placeholder="queryPlaceholder"></label>
                <label><span data-i18n="searchBase"></span><input id="search-base" list="search-choices" data-i18n-placeholder="searchBasePlaceholder" autocomplete="off"><datalist id="search-choices"></datalist></label>
                <div class="search-tags-field"><span data-i18n="searchTags"></span><div id="search-tags" class="search-tags" role="group" data-i18n-aria-label="searchTags"></div></div>
              </div>
              <div class="search-options-row">
                <label class="search-option"><input id="search-exclude-multiple" type="checkbox"><span data-i18n="searchExcludeMultiple"></span></label>
                <button id="search-clear" type="button" data-i18n="searchClear"></button>
              </div>
            </fieldset>
          </form>
          <!-- <p class="section-note" data-i18n="searchNote"></p> -->
          <div id="search-base-preview" data-i18n-aria-label="searchBase" role="region" hidden></div>
          <p id="search-status" role="status"></p>
          <button id="search-retry" type="button" hidden data-i18n="retry"></button>
          <div id="search-list" class="search-list"></div>
          <nav id="search-pagination" class="search-pagination" hidden data-i18n-aria-label="selectPage">
            <button id="search-previous" type="button" data-i18n="previous"></button><span id="search-page"></span><button id="search-next" type="button" data-i18n="next"></button>
          </nav>
        </div>
        <div id="favorites-panel" role="tabpanel" aria-labelledby="favorites-tab" hidden>
          <p id="favorites-status" role="status"></p>
          <div id="favorites-list" class="search-list"></div>
        </div>
      </section>
    </section>
    <aside class="sub" data-i18n-aria-label="previewAndHistory">
      <section class="panel preview-panel">
        <div class="section-heading preview-heading"><h2 data-i18n="preview"></h2><span id="preview-sound-id" aria-live="polite"></span><span class="preview-indicator"><span id="preview-loading" role="status" data-i18n-aria-label="loading" hidden></span></span></div>
        <div class="preview-waveform">
          <canvas id="preview-waveform" aria-hidden="true"></canvas>
          <input id="preview-seek" type="range" min="0" max="0" step="0.01" value="0" data-i18n-aria-label="seek" disabled>
        </div>
        <div class="preview-transport">
          <button id="preview-toggle" type="button" data-i18n-aria-label="play" data-i18n-title="play" disabled>
            <svg class="preview-play-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 5v14l11-7z"/></svg>
            <svg class="preview-pause-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
          </button>
          <div class="preview-volume-control">
            <button id="preview-volume-toggle" type="button" data-i18n-aria-label="previewVolume" aria-controls="select-master-volume" aria-expanded="false">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 9v6h4l5 4V5L7 9H3zm12-1v8a5 5 0 0 0 0-8zm0-4v2a7 7 0 0 1 0 12v2a9 9 0 0 0 0-16z"/></svg>
            </button>
            <div class="param" id="select-master-volume" role="group" data-i18n-aria-label="previewVolume" aria-hidden="true" inert></div>
          </div>
          <output id="preview-time">0:00.0 / 0:00.0</output>
        </div>
        <p id="preview-status" role="status"></p>
      </section>
      <section class="panel command-panel">
        <div class="section-heading"><h2 data-i18n="command"></h2><button type="button" id="command-settings-button" class="settings-button" popovertarget="command-settings" data-i18n="settings"></button></div>
        <div class="output" aria-live="polite"></div>
      </section>
      <section class="panel history-panel">
        <div class="section-heading"><h2 data-i18n="historyTitle"></h2></div>
        <p class="section-note" data-i18n="historyNote"></p>
        <div class="history" data-i18n-data-empty-text="historyEmpty"></div>
      </section>
    </aside>
  </main>
  <section id="command-settings" class="settings-popover" popover="auto" aria-labelledby="command-settings-title">
    <div class="section-heading"><h2 id="command-settings-title" data-i18n="commandSettings"></h2><button type="button" class="settings-button" popovertarget="command-settings" popovertargetaction="hide" data-i18n-aria-label="closeCommandSettings" data-i18n="close"></button></div>
        <div class="params">
          <label class="param" id="select-source"><span class="param-label" data-i18n="source"></span></label>
          <label class="param" id="select-sound-volume"><span class="param-label" data-i18n="volume"></span></label>
          <div class="param" id="select-pitch" role="group" data-i18n-aria-label="pitch"><span class="param-label" data-i18n="pitch"></span></div>
          <div class="param" id="select-min-volume" role="group" data-i18n-aria-label="minVolume"><span class="param-label" data-i18n="minVolume"></span></div>
        </div>
  </section>
  <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <script src="Scripts/CommandSettingsPopover.js" type="module"></script>
  <script src="Scripts/Main.js" type="module"></script>
</body>
</html>
